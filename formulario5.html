<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04 - Formulário de Ordem de Serviço ou Agendamento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h3 class="mb-4 text-center">Novo Cadastro</h3>
                    <form>
                        <div class="row g-3">

                            <div class="col-sm-6">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" placeholder="Maria" required>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label">Sobrenome</label>
                                <input type="text" class="form-control" placeholder="Ferreira" required>
                            </div>

                            <div class="col-12">
                                <div class="col-12"></div>
                                <label class="form-label">Contato</label>
                                <div class="input-group">
                                    <span class="input-group-text">+41</span>
                                    <input type="text" class="form-control" placeholder="9999-9999">
                                </div>
                            </div>

                        </div>

                        <div class="col-sm-6"></div>
                        <label class="form-label">Nome do Livro</label>
                        <textarea type="text" rows="4" class="form-control" required></textarea>
                        
                        <div class="col-12"></div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="termos">
                        <label for="termos" class="form-check-label">Tomo a responsabilidade de cobrar o aluno em caso de atraso.</label>                
                        <div class="col-12 mt-4"></div>
                    <button class="btn btn-primary w-100" type="submit">Finalizar Cadastro</button>
                    <p></p>
                    <a href="desafio05.html" class="btn btn-danger">Voltar</a>
                    </div>
                </div>



                    
                </div>
                </div>

                

            </div>

            </form>
        </div>
    </div>
    </div>

    </div>
</body>

</html>
